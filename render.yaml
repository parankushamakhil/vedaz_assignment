services:
  - type: web
    name: real-time-chat-server
    env: node
    plan: free
    rootDir: real-time-chat/server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        sync: false # Set this to your frontend URL (e.g., Vercel/Netlify) in the Render dashboard!
      - key: MONGO_URI
        sync: false # Do not commit the actual URI here for security; add it in the Render dashboard!
